cat > .isort.cfg << 'EOF'
[settings]
profile = django
line_length = 100
known_django = django
sections = FUTURE,STDLIB,DJANGO,THIRDPARTY,FIRSTPARTY,LOCALFOLDER
skip = migrations,venv,.venv,env,staticfiles,media
multi_line_output = 3
include_trailing_comma = True
force_grid_wrap = 0
use_parentheses = True
ensure_newline_before_comments = True
EOF