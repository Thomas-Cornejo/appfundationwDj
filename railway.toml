[build]
builder = "nixpacks"

[deploy]
startCommand = "python manage.py migrate && gunicorn appfundationwDj.wsgi:application"

# Degradar indicadores
[[crons]]
schedule = "0 */4 * * *"
command = "python manage.py degrade_indicators"

# Resetear misiones diarias/semanales
[[crons]]
schedule = "1 5 * * *"
command = "python manage.py reset_missions"
