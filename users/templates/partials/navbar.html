{% load static %}
<script src="{% static 'js/navbar.js' %}"></script>
<header class="bg-white shadow-md w-full">
  <nav
    class="max-w-screen-2xl mx-auto flex items-center justify-between px-6 py-1"
  >
    <div class="flex items-center space-x-1">
      <img src="{% static 'images/logo.png' %}" alt="Logo" class="w-20 h-15" />
      <span class="text-2xl font-bold text-blue-600">Soldiaridad Cucuta</span>
    </div>

    <ul class="flex items-center space-x-8">
      <li>
        <a href="{% url 'home' %}" class="nav-link" data-page="home"
          >Nosotros</a
        >
      </li>
      <li><a href="{% url 'adoption_list' %}" class="nav-link" data-page="adopt">Adóptanos</a></li>
      <li><a href="{% url 'sponsorhip_list' %}" class="nav-link" data-page="apadrina">Apadrínanos</a></li>
      <li><a href="#" class="nav-link" data-page="ayuda">Ayúdanos</a></li>
    </ul>

    {% if user.is_authenticated %}
    <div class="relative">
      <button id="user-button" class="bg-blue-600 text-white px-5 py-2 rounded-full">
        {{ user.username }}
      </button>
      <div
        id="user-menu"
        class="absolute right-0 mt-2 w-40 bg-white border border-gray-200 rounded-md shadow-lg hidden"
      >
        <a
          href="{% url 'profile' %}"
          class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100"
          >Perfil</a
        >
        <form id="logout-form" method="post" action="{% url 'logout' %}" style="display: none;">
          {% csrf_token %}
        </form>
        <a
          href="#"
          onclick="event.preventDefault(); document.getElementById('logout-form').submit();"
          class="block px-4 py-2 text-sm text-red-600 hover:bg-gray-100"
          >Cerrar sesión</a
        >
      </div>
    </div>
    {% else %}
    <a
      href="{% url 'login' %}"
      class="bg-blue-600 text-white px-5 py-2 rounded-full"
      >Iniciar sesión</a
    >
    {% endif %}
  </nav>
</header>
