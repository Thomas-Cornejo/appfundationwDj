{% extends "base.html" %} {% load tailwind_filters %} {% block content %} 
{% load static %}

<div class="flex min-h-screen items-center justify-center bg-gray-50 px-4">
  <div
    class="w-full max-w-4xl overflow-hidden rounded-2xl shadow-lg bg-white grid grid-cols-1 md:grid-cols-2"
  >
    <div class="p-8 sm:p-12 flex flex-col justify-center">
      <h2 class="text-3xl font-bold text-gray-800 mb-6">Bienvenido 👋</h2>
      <p class="text-gray-500 mb-6">
        Ingresa tus credenciales para acceder a tu cuenta.
      </p>

      <form action="" method="post" class="space-y-4">
        {% csrf_token %} {{ form|crispy }}

        <button
          type="submit"
          class="w-full rounded-lg bg-indigo-600 px-4 py-2 text-white font-semibold hover:bg-blue-500 transition duration-200"
        >
          Iniciar sesión
        </button>
      </form>

      <p class="mt-6 text-sm text-gray-500">
        ¿No tienes una cuenta?
        <a href="#" class="text-indigo-600 hover:underline">Regístrate aquí</a>
      </p>
    </div>

    <div class="hidden md:block">
      <img
        src="{% static 'WelcomeDog.png' %}"
        alt="Welcome Dog"
        class="h-full w-full object-cover"
      />
    </div>
  </div>
</div>
{% endblock content %}
